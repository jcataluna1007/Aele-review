<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0E0E16"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AELE Review"/>
<meta name="description" content="PRC Aeronautical Engineer Licensure Exam Review Plan"/>
<link rel="manifest" href="manifest.json"/>
<title>AELE Review Plan</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0E0E16;--bg2:#12121E;--bg3:#141420;--bg4:#10101A;
  --border:#1E1E30;--border2:#1A1A28;
  --text:#F0EEFF;--text2:#A0A0C8;--text3:#7070A0;--text4:#555580;--text5:#444466;
  --safe-bottom:env(safe-area-inset-bottom,0px);--nav-h:64px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100dvh;height:100vh}

/* HEADER */
#header{background:var(--bg2);padding:14px 16px 10px;border-bottom:2px solid #38BDF8;transition:border-color .3s;flex-shrink:0}
#header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#header-label{font-size:9px;letter-spacing:.3em;color:var(--text5);text-transform:uppercase;font-family:monospace;margin-bottom:3px}
#header-title{font-size:17px;font-weight:700;color:var(--text);line-height:1.25}
#header-title span{transition:color .3s}
#header-sub{font-size:10px;color:var(--text5);font-family:monospace;margin-top:3px}
#ring-wrap{flex-shrink:0;text-align:center}
#ring-label{font-size:9px;color:var(--text5);font-family:monospace;margin-top:2px}
#ring-track{fill:none;stroke:#1E1E30;stroke-width:5}
#ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s ease,stroke .3s}
#ring-text{font-size:13px;font-weight:bold;font-family:monospace;fill:var(--text)}
#weight-bar{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:2px;margin-top:10px}
.wb-seg{border-radius:2px;cursor:pointer;transition:opacity .2s}

/* SCROLL */
#scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 8px)}

/* REVIEW VIEW */
#subject-view{padding:14px 14px 0}
#subj-header{margin-bottom:14px;padding-bottom:12px}
#subj-header-row{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#subj-icon{font-size:22px}
#subj-badge{font-size:9px;font-family:monospace;letter-spacing:.2em;color:var(--text4);text-transform:uppercase}
#subj-name{font-size:18px;font-weight:700;color:var(--text)}
#subj-obj{font-size:12px;color:var(--text3);font-style:italic;line-height:1.6}
.topic-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:7px;transition:border-color .2s}
.topic-card.open{border-color:rgba(255,255,255,.15)}
.topic-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 12px;background:var(--bg3);border:none;text-align:left;cursor:pointer;color:var(--text);transition:background .2s;min-height:52px}
.topic-btn:active{opacity:.8}
.topic-card.open .topic-btn{background:#141428}
.topic-btn-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.topic-num{width:24px;height:24px;border-radius:5px;flex-shrink:0;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;font-weight:bold;color:var(--text4);transition:all .2s}
.topic-name{font-size:13.5px;color:var(--text2);font-weight:500;line-height:1.3}
.topic-card.open .topic-name{color:var(--text);font-weight:600}
.topic-btn-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-left:8px}
.topic-mini-bar{height:3px;width:36px;background:var(--border);border-radius:2px;overflow:hidden}
.topic-mini-fill{height:100%;border-radius:2px;transition:width .3s}
.topic-count{font-size:10px;color:var(--text4);font-family:monospace}
.topic-chevron{font-size:10px;transition:transform .2s;display:inline-block}
.topic-card.open .topic-chevron{transform:rotate(180deg)}
.subtopics{background:var(--bg4);padding:4px 12px 10px 46px;border-top:1px solid var(--border2)}
.sub-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;cursor:pointer;border-bottom:1px solid #16162A;min-height:44px}
.sub-item:last-child{border-bottom:none}
.sub-item:active{opacity:.7}
.sub-check{width:18px;height:18px;border-radius:4px;flex-shrink:0;margin-top:1px;border:1.5px solid #2E2E48;background:transparent;display:flex;align-items:center;justify-content:center;transition:all .15s;font-size:10px;color:#0E0E16;font-weight:bold}
.sub-label{font-size:13px;color:var(--text2);line-height:1.5;transition:all .15s}
.sub-label.done{color:#333355;text-decoration:line-through}
.refs-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px}
.refs-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 12px;background:var(--bg3);border:none;text-align:left;cursor:pointer;color:var(--text3);font-size:11px;font-family:monospace;letter-spacing:.1em;text-transform:uppercase;min-height:44px}
.refs-chevron{font-size:10px;transition:transform .2s;display:inline-block}
.refs-open .refs-chevron{transform:rotate(180deg)}
.refs-body{background:var(--bg4);padding:6px 12px 10px;border-top:1px solid var(--border2)}
.ref-item{font-size:12px;color:var(--text3);font-style:italic;padding:5px 0;border-bottom:1px dashed var(--border2);line-height:1.5}
.ref-item:last-child{border-bottom:none}

/* QUIZ VIEW */
#quiz-view{padding:14px;display:none;flex-direction:column;gap:12px}
#quiz-view.active{display:flex}
.quiz-header-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.quiz-title{font-size:16px;font-weight:700;color:var(--text)}
.quiz-subtitle{font-size:10px;color:var(--text4);font-family:monospace;margin-bottom:10px}
.quiz-progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:16px}
.quiz-progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.quiz-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px 16px;position:relative}
.quiz-subject-tag{display:inline-block;font-size:9px;font-family:monospace;letter-spacing:.15em;text-transform:uppercase;padding:3px 8px;border-radius:3px;margin-bottom:10px}
.quiz-qnum{font-size:10px;color:var(--text4);font-family:monospace;margin-bottom:8px}
.quiz-question{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:18px;font-weight:500}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:11px 13px;border-radius:7px;border:1px solid var(--border);background:var(--bg4);cursor:pointer;transition:all .15s;min-height:44px;text-align:left;width:100%}
.quiz-opt:active{opacity:.8}
.quiz-opt-letter{width:22px;height:22px;border-radius:4px;flex-shrink:0;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;font-weight:bold;color:var(--text4);transition:all .15s}
.quiz-opt-text{font-size:13px;color:var(--text2);line-height:1.45}
.quiz-opt.selected{border-color:#38BDF8}
.quiz-opt.correct{border-color:#4ADE80;background:rgba(74,222,128,.08)}
.quiz-opt.correct .quiz-opt-letter{background:#4ADE80;color:#0E0E16}
.quiz-opt.wrong{border-color:#FB7185;background:rgba(251,113,133,.08)}
.quiz-opt.wrong .quiz-opt-letter{background:#FB7185;color:#0E0E16}
.quiz-opt.reveal-correct{border-color:#4ADE80;background:rgba(74,222,128,.05)}
.quiz-opt.reveal-correct .quiz-opt-letter{background:rgba(74,222,128,.3);color:#4ADE80}
.quiz-explanation{margin-top:14px;padding:12px;background:var(--bg2);border-radius:7px;border-left:3px solid #38BDF8;font-size:12px;color:var(--text3);line-height:1.6;display:none}
.quiz-explanation.show{display:block}
.quiz-actions{display:flex;gap:8px;margin-top:4px}
.btn-primary{flex:1;padding:13px;border-radius:8px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:opacity .15s;font-family:'Segoe UI',sans-serif}
.btn-primary:active{opacity:.8}
.btn-secondary{padding:13px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;font-size:13px;color:var(--text3);cursor:pointer;transition:all .15s}
.btn-secondary:active{opacity:.7}

/* QUIZ SETUP */
#quiz-setup{display:flex;flex-direction:column;gap:10px}
.setup-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:2px}
.setup-sub{font-size:11px;color:var(--text4);font-family:monospace;margin-bottom:8px}
.setup-section{font-size:10px;letter-spacing:.2em;color:var(--text5);text-transform:uppercase;font-family:monospace;margin-bottom:6px;margin-top:4px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px}
.filter-chip{padding:7px 12px;border-radius:20px;border:1px solid var(--border);background:var(--bg3);font-size:11px;color:var(--text3);cursor:pointer;transition:all .15s}
.filter-chip.on{border-color:currentColor}
.filter-chip:active{opacity:.8}
.count-row{display:flex;gap:8px}
.count-btn{flex:1;padding:10px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);font-size:12px;color:var(--text3);cursor:pointer;transition:all .15s;font-family:monospace}
.count-btn.on{border-color:#38BDF8;color:#38BDF8;background:rgba(56,189,248,.08)}

/* QUIZ RESULTS */
#quiz-results{display:none;flex-direction:column;gap:12px;padding:14px}
#quiz-results.show{display:flex}
.result-card{background:var(--bg3);border-radius:10px;padding:20px;text-align:center}
.result-score{font-size:52px;font-weight:900;line-height:1;font-family:monospace}
.result-label{font-size:11px;color:var(--text4);font-family:monospace;margin-top:4px}
.result-breakdown{display:flex;gap:0;margin-top:16px;border-radius:6px;overflow:hidden}
.rb-item{flex:1;padding:10px 6px;text-align:center}
.rb-num{font-size:20px;font-weight:700;font-family:monospace}
.rb-label{font-size:9px;color:var(--text4);font-family:monospace;text-transform:uppercase;margin-top:2px}
.result-per-subject{margin-top:8px}
.rps-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2)}
.rps-row:last-child{border-bottom:none}
.rps-name{font-size:12px;color:var(--text2)}
.rps-score{font-size:12px;font-family:monospace}
.rps-bar-wrap{flex:1;margin:0 10px;height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.rps-bar{height:100%;border-radius:2px}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(var(--nav-h) + var(--safe-bottom));background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:stretch;padding-bottom:var(--safe-bottom);z-index:100;overflow-x:auto;scrollbar-width:none}
#bottom-nav::-webkit-scrollbar{display:none}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;min-width:56px;padding:6px 4px;background:transparent;border:none;cursor:pointer;gap:3px;border-top:2px solid transparent;transition:border-color .2s}
.nav-btn:active{opacity:.7}
.nav-icon{font-size:16px;line-height:1}
.nav-label{font-size:8px;font-family:monospace;letter-spacing:.05em;color:var(--text5);text-transform:uppercase;white-space:nowrap}
.nav-btn.active .nav-label{color:var(--text)}
.nav-dot{width:4px;height:4px;border-radius:50%;margin-top:1px}

/* QUIZ NAV ITEM */
.nav-quiz-badge{font-size:7px;font-family:monospace;background:#FB7185;color:#0E0E16;border-radius:8px;padding:1px 4px;font-weight:bold}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.anim{animation:fadeUp .2s ease}
#scroll-area::-webkit-scrollbar{width:3px}
#scroll-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>

  <nav id="bottom-nav"></nav>
</div>

const STORAGE_KEY = 'aele_checked_v2';
let checked = {};
try { checked = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch(e){}

let expanded = {}, refsOpen = {}, activeSubject = 0;
let currentScreen = 'review'; // 'review' | 'quiz' | 'results'

// Quiz state
let quizFilters = new Set([0,1,2,3,4,5]);
let quizCount = 20;
let quizQueue = [], quizIndex = 0, quizAnswered = false;
let quizScores = {correct:0, wrong:0, perSubject:{}};

const totalSubs = SUBJECTS.reduce((a,s) => a + s.topics.reduce((b,t) => b + t.subs.length,0),0);

function saveChecked() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); } catch(e){} }

function subjectProgress(si) {
  const s = SUBJECTS[si];
  const total = s.topics.reduce((a,t) => a + t.subs.length, 0);
  const done = s.topics.reduce((a,t,ti) => a + t.subs.filter((_,xi) => checked[`${si}-${ti}-${xi}`]).length, 0);
  return {done, total, pct: total ? Math.round(done/total*100) : 0};
}

function overallProgress() {
  const done = Object.values(checked).filter(Boolean).length;
  return {done, total: totalSubs, pct: Math.round(done/totalSubs*100)};
}

function hexAlpha(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

// RENDER HEADER + NAV
// ═══════════════════════════════════════
function renderHeader() {
  const s = SUBJECTS[activeSubject];
  const isQuiz = currentScreen !== 'review';
  document.getElementById('header').style.borderBottomColor = isQuiz ? '#FB7185' : s.color;
  document.getElementById('header-accent').style.color = isQuiz ? '#FB7185' : s.color;
  document.getElementById('header-accent').textContent = isQuiz ? (currentScreen === 'results' ? 'Quiz Results' : 'Quiz Mode') : 'Review Plan';

  const {done, total, pct} = overallProgress();
  const r = 23, circ = 2*Math.PI*r;
  const fill = document.getElementById('ring-fill');
  fill.style.stroke = isQuiz ? '#FB7185' : s.color;
  fill.setAttribute('stroke-dasharray', circ);
  fill.setAttribute('stroke-dashoffset', circ*(1-pct/100));
  document.getElementById('ring-text').textContent = pct+'%';
  document.getElementById('ring-label').textContent = `${done}/${total}`;

  const bar = document.getElementById('weight-bar');
  bar.innerHTML = '';
  SUBJECTS.forEach((sb, i) => {
    const seg = document.createElement('div');
    seg.className = 'wb-seg';
    seg.style.flex = sb.weightNum;
    seg.style.background = i === activeSubject && !isQuiz ? sb.color : hexAlpha(sb.color, 0.25);
    seg.onclick = () => { if(currentScreen==='review') switchSubject(i); };
    bar.appendChild(seg);
  });
}

function renderNav() {
  const nav = document.getElementById('bottom-nav');
  nav.innerHTML = '';
  SUBJECTS.forEach((s, i) => {
    const {pct} = subjectProgress(i);
    const isActive = currentScreen==='review' && activeSubject===i;
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (isActive ? ' active' : '');
    btn.style.borderTopColor = isActive ? s.color : 'transparent';
    btn.innerHTML = `
      <div class="nav-icon" style="color:${isActive?s.color:'#444466'}">${s.icon}</div>
      <div class="nav-label">${s.code}</div>
      <div class="nav-dot" style="background:${pct>0?s.color:'#333350'};opacity:${pct>0?1:0.4}"></div>`;
    btn.onclick = () => { currentScreen='review'; switchSubject(i); };
    nav.appendChild(btn);
  });
  // Quiz button
  const qbtn = document.createElement('button');
  const isQActive = currentScreen !== 'review';
  qbtn.className = 'nav-btn' + (isQActive ? ' active' : '');
  qbtn.style.borderTopColor = isQActive ? '#FB7185' : 'transparent';
  qbtn.innerHTML = `
    <div class="nav-icon" style="color:${isQActive?'#FB7185':'#444466'}">✦</div>
    <div class="nav-label" style="color:${isQActive?'#F0EEFF':''}">Quiz</div>
    <div class="nav-quiz-badge">${QUIZ.length}Q</div>`;
  qbtn.onclick = () => showQuizSetup();
  nav.appendChild(qbtn);
}

// REVIEW SCREEN
// ═══════════════════════════════════════
function renderSubject() {
  const si = activeSubject;
  const s = SUBJECTS[si];
  const view = document.getElementById('subject-view');
  view.className = 'anim';
  setTimeout(() => view.className = '', 300);

  let html = `<div id="subj-header" style="border-bottom:1px solid ${hexAlpha(s.color,.2)}">
    <div id="subj-header-row">
      <div id="subj-icon" style="color:${s.color}">${s.icon}</div>
      <div>
        <div id="subj-badge">Subject ${s.code} · ${s.weight} of Exam</div>
        <div id="subj-name">${s.name}</div>
      </div>
    </div>
    <div id="subj-obj">${s.objective}</div>
  </div>`;

  s.topics.forEach((topic, ti) => {
    const tKey = `${si}-${ti}`;
    const isOpen = !!expanded[tKey];
    const done = topic.subs.filter((_,xi) => checked[`${si}-${ti}-${xi}`]).length;
    const complete = done === topic.subs.length;
    const pct = done/topic.subs.length*100;
    html += `<div class="topic-card${isOpen?' open':''}" id="tc-${tKey}">
      <button class="topic-btn" onclick="toggleTopic('${tKey}')">
        <div class="topic-btn-left">
          <div class="topic-num${complete?' done':''}" style="${complete?`background:${s.color};color:#0E0E16`:''}">
            ${complete?'✓':ti+1}
          </div>
          <div class="topic-name">${topic.name}</div>
        </div>
        <div class="topic-btn-right">
          ${done>0?`<div class="topic-mini-bar"><div class="topic-mini-fill" style="width:${pct}%;background:${s.color}"></div></div>`:''}
          <span class="topic-count">${done}/${topic.subs.length}</span>
          <span class="topic-chevron" style="color:${s.color}">▾</span>
        </div>
      </button>
      ${isOpen ? renderSubtopics(si, ti) : ''}
    </div>`;
  });

  const rOpen = !!refsOpen[si];
  html += `<div class="refs-card${rOpen?' refs-open':''}">
    <button class="refs-btn" onclick="toggleRefs(${si})">
      <span>📚 References (${s.refs.length})</span>
      <span class="refs-chevron">▾</span>
    </button>
    ${rOpen?`<div class="refs-body">${s.refs.map((r,i)=>`<div class="ref-item">${i+1}. ${r}</div>`).join('')}</div>`:''}
  </div>`;

  view.innerHTML = html;
  document.getElementById('scroll-area').scrollTop = 0;
}

function renderSubtopics(si, ti) {
  const s = SUBJECTS[si];
  const topic = s.topics[ti];
  return `<div class="subtopics">${topic.subs.map((sub,xi) => {
    const ck = `${si}-${ti}-${xi}`, isDone = !!checked[ck];
    return `<div class="sub-item" onclick="toggleCheck('${ck}',${si})">
      <div class="sub-check" style="${isDone?`background:${s.color};border-color:${s.color}`:''}">
        ${isDone?'✓':''}
      </div>
      <span class="sub-label${isDone?' done':''}">${sub}</span>
    </div>`;
  }).join('')}</div>`;
}

function showQuizSetup() {
  currentScreen = 'quiz';
  document.getElementById('subject-view').style.display = 'none';
  document.getElementById('quiz-results').className = '';
  const qv = document.getElementById('quiz-view');
  qv.className = 'active anim';
  setTimeout(() => qv.className = 'active', 300);
  renderQuizSetup();
  renderHeader(); renderNav();
  document.getElementById('scroll-area').scrollTop = 0;
}

function renderQuizSetup() {
  const qv = document.getElementById('quiz-view');
  const filterBtns = SUBJECTS.map((s,i) => {
    const on = quizFilters.has(i);
    return `<button class="filter-chip${on?' on':''}" style="${on?`color:${s.color};border-color:${s.color};background:${hexAlpha(s.color,.1)}`:''}" onclick="toggleFilter(${i})">${s.icon} ${s.code}</button>`;
  }).join('');
  const countBtns = [10,20,30].map(n =>
    `<button class="count-btn${quizCount===n?' on':''}" onclick="setCount(${n})">${n} Qs</button>`
  ).join('');
  const available = QUIZ.filter(q => quizFilters.has(q.s)).length;
  qv.innerHTML = `<div id="quiz-setup">
    <div class="setup-title">✦ Quiz Mode</div>
    <div class="setup-sub">Practice questions from FEATI, PHILSCA, PATTS & WIZ Academy mock exams</div>
    <div class="setup-section">Filter by Subject</div>
    <div class="filter-row">${filterBtns}</div>
    <div class="setup-section" style="margin-top:12px">Number of Questions</div>
    <div class="count-row">${countBtns}</div>
    <div style="font-size:10px;color:var(--text4);font-family:monospace;margin-top:6px">${available} questions available for selected subjects</div>
    <div class="quiz-actions" style="margin-top:8px">
      <button class="btn-primary" style="background:#FB7185;color:#0E0E16" onclick="startQuiz()">Start Quiz →</button>
      <button class="btn-secondary" onclick="backToReview()">← Review</button>
    </div>
  </div>`;
}

function toggleFilter(i) {
  if (quizFilters.has(i)) { if(quizFilters.size > 1) quizFilters.delete(i); }
  else quizFilters.add(i);
  renderQuizSetup();
}
function setCount(n) { quizCount = n; renderQuizSetup(); }

function startQuiz() {
  let pool = QUIZ.filter(q => quizFilters.has(q.s));
  // shuffle
  for (let i = pool.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  quizQueue = pool.slice(0, Math.min(quizCount, pool.length));
  quizIndex = 0; quizAnswered = false;
  quizScores = {correct:0, wrong:0, perSubject:{}};
  SUBJECTS.forEach((_,i) => quizScores.perSubject[i] = {correct:0,total:0});
  renderQuestion();
}

function renderQuestion() {
  const qv = document.getElementById('quiz-view');
  if (quizIndex >= quizQueue.length) { showResults(); return; }
  const q = quizQueue[quizIndex];
  const s = SUBJECTS[q.s];
  const pct = (quizIndex/quizQueue.length*100).toFixed(0);
  quizAnswered = false;

  const opts = q.opts.map((o,i) =>
    `<button class="quiz-opt" id="qopt-${i}" onclick="answerQuiz(${i})">
      <div class="quiz-opt-letter">${'ABCD'[i]}</div>
      <div class="quiz-opt-text">${o}</div>
    </button>`
  ).join('');

  qv.innerHTML = `
    <div class="quiz-header-bar">
      <span style="font-size:10px;color:var(--text4);font-family:monospace">${quizIndex+1} / ${quizQueue.length}</span>
      <button class="btn-secondary" style="padding:6px 10px;font-size:11px" onclick="showQuizSetup()">✕ End</button>
    </div>
    <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pct}%;background:${s.color}"></div></div>
    <div class="quiz-card">
      <span class="quiz-subject-tag" style="background:${hexAlpha(s.color,.15)};color:${s.color}">${s.icon} ${s.name}</span>
      <div class="quiz-qnum">${q.topic}</div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">${opts}</div>
      <div class="quiz-explanation" id="quiz-exp">${q.exp}</div>
    </div>
    <div class="quiz-actions" id="quiz-actions" style="display:none">
      <button class="btn-primary" style="background:${s.color};color:#0E0E16" onclick="nextQuestion()">
        ${quizIndex+1 < quizQueue.length ? 'Next Question →' : 'See Results →'}
      </button>
    </div>`;
}

function answerQuiz(chosen) {
  if (quizAnswered) return;
  quizAnswered = true;
  const q = quizQueue[quizIndex];
  const correct = q.a;
  quizScores.perSubject[q.s].total++;

  document.querySelectorAll('.quiz-opt').forEach((el, i) => {
    el.onclick = null;
    if (i === correct) el.classList.add(chosen === correct ? 'correct' : 'reveal-correct');
    else if (i === chosen && chosen !== correct) el.classList.add('wrong');
  });

  if (chosen === correct) {
    quizScores.correct++;
    quizScores.perSubject[q.s].correct++;
  } else {
    quizScores.wrong++;
  }

  document.getElementById('quiz-exp').classList.add('show');
  document.getElementById('quiz-actions').style.display = 'flex';
}

function nextQuestion() {
  quizIndex++;
  renderQuestion();
  document.getElementById('scroll-area').scrollTop = 0;
}

function showResults() {
  currentScreen = 'results';
  document.getElementById('quiz-view').className = '';
  const rr = document.getElementById('quiz-results');
  rr.className = 'show anim';
  setTimeout(() => rr.className = 'show', 300);

  const total = quizScores.correct + quizScores.wrong;
  const pct = total ? Math.round(quizScores.correct/total*100) : 0;
  const color = pct >= 75 ? '#4ADE80' : pct >= 50 ? '#FBBF24' : '#FB7185';
  const label = pct >= 75 ? '✓ Passing' : pct >= 50 ? '~ Near Passing' : '✗ Needs Work';

  let perSub = '';
  SUBJECTS.forEach((s,i) => {
    const ps = quizScores.perSubject[i];
    if (!ps.total) return;
    const spct = Math.round(ps.correct/ps.total*100);
    perSub += `<div class="rps-row">
      <div class="rps-name">${s.icon} ${s.name.split(' ')[0]}</div>
      <div class="rps-bar-wrap"><div class="rps-bar" style="width:${spct}%;background:${s.color}"></div></div>
      <div class="rps-score" style="color:${s.color}">${ps.correct}/${ps.total}</div>
    </div>`;
  });

  rr.innerHTML = `
    <div class="result-card">
      <div class="result-score" style="color:${color}">${pct}%</div>
      <div class="result-label">${label} · ${quizScores.correct} correct of ${total} questions</div>
      <div class="result-breakdown">
        <div class="rb-item" style="background:rgba(74,222,128,.1)">
          <div class="rb-num" style="color:#4ADE80">${quizScores.correct}</div>
          <div class="rb-label">Correct</div>
        </div>
        <div class="rb-item" style="background:rgba(251,113,133,.1)">
          <div class="rb-num" style="color:#FB7185">${quizScores.wrong}</div>
          <div class="rb-label">Wrong</div>
        </div>
        <div class="rb-item" style="background:rgba(251,191,36,.1)">
          <div class="rb-num" style="color:#FBBF24">${total}</div>
          <div class="rb-label">Total</div>
        </div>
      </div>
    </div>
    <div class="result-card">
      <div style="font-size:11px;color:var(--text4);font-family:monospace;text-transform:uppercase;letter-spacing:.15em;margin-bottom:10px">By Subject</div>
      <div class="result-per-subject">${perSub}</div>
    </div>
    <div class="quiz-actions">
      <button class="btn-primary" style="background:#FB7185;color:#0E0E16" onclick="startQuiz()">Retry Quiz</button>
      <button class="btn-secondary" onclick="showQuizSetup()">New Setup</button>
    </div>
    <div style="padding-bottom:8px"></div>`;

  renderHeader(); renderNav();
  document.getElementById('scroll-area').scrollTop = 0;
}

// ═══════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════
function switchSubject(i) {
  activeSubject = i;
  currentScreen = 'review';
  document.getElementById('quiz-view').className = '';
  document.getElementById('quiz-results').className = '';
  document.getElementById('subject-view').style.display = '';
  renderHeader(); renderNav(); renderSubject();
}

function backToReview() { switchSubject(activeSubject); }

function toggleTopic(tKey) {
  expanded[tKey] = !expanded[tKey];
  renderSubject();
}

function toggleCheck(ck, si) {
  checked[ck] = !checked[ck];
  saveChecked();
  renderHeader(); renderNav(); renderSubject();
}

function toggleRefs(si) {
  refsOpen[si] = !refsOpen[si];
  renderSubject();
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
function init() {
  renderHeader(); renderNav(); renderSubject();
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
}
init();
</script>
</body>
</html>
